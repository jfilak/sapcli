[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapcli"
version = "1.0.0"
description = "Command line interface to SAP products"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jakub Filak", email = "jakub@thefilaks.net" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 6 - Mature",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.34.2",
    "pyodata>=1.12.0",
    "PyYAML>=6.0.3",
    "platformdirs>=4.5.1",
    "truststore>=0.10.4",
]

[project.urls]
Homepage = "https://github.com/jfilak/sapcli"
Repository = "https://github.com/jfilak/sapcli"
Issues = "https://github.com/jfilak/sapcli/issues"

[project.scripts]
sapcli = "sap.cli._entry:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.15.2",
    "pylint>=4.0.7",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "types-PyYAML>=6.0.1",
    "types-requests>=2.33.0.20260712",
    "build",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov",
    "codecov",
    "flake8",
    "pylint",
]

[tool.setuptools.packages.find]
exclude = ["test*", "build", "dist"]
